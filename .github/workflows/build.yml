# OSTLERTEKKERS HEN - CI: host tests + UI preview + real PS4 PKG build.
# The PKG is uploaded as artifact "PS4_HEN_ULTIMATE-pkg" (Actions tab -> run -> Artifacts).
name: Build PS4 PKG

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Host tests + UI preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (g++, -Werror)
        run: make -f Makefile.host test
      - name: Unit tests (AddressSanitizer + UBSan)
        run: |
          make -f Makefile.host clean
          make -f Makefile.host CXX=g++ CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -Isrc -I. -fsanitize=address,undefined -fno-omit-frame-pointer" test
      - name: UI preview (same renderer as PS4)
        run: |
          make -f Makefile.host clean
          make -f Makefile.host CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Isrc -I." preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: build/preview/*.png

  ps4:
    name: PS4 PKG (OpenOrbis v0.5.4)
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          clang++-18 --version

      - name: Install libssl1.1 (PkgTool.Core is built on an old .NET runtime that needs it)
        run: |
          echo "deb http://security.ubuntu.com/ubuntu focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update
          sudo apt-get install -y libssl1.1

      - name: Install .NET 8 (for PkgTool.Core)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download OpenOrbis PS4 Toolchain v0.5.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.4 -R OpenOrbis/OpenOrbis-PS4-Toolchain -p 'toolchain-llvm-18.tar.gz' -D /tmp
          sha256sum /tmp/toolchain-llvm-18.tar.gz
          sudo mkdir -p /opt/oo && sudo chown "$USER" /opt/oo
          tar -xzf /tmp/toolchain-llvm-18.tar.gz -C /opt/oo
          TC="$(dirname "$(find /opt/oo -name link.x -print -quit)")"
          test -n "$TC" || { echo "link.x not found in toolchain archive"; find /opt/oo -maxdepth 3; exit 1; }
          chmod +x "$TC"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Toolchain: $TC"
          ls "$TC" "$TC/bin/linux" || true
          echo "--- stub libraries used:"; ls "$TC/lib" | grep -E 'SceAudioOut|SceHttp|SceSsl|SceNet|SceSysmodule' || true
          echo "--- .prx files in toolchain:"; find "$TC" -name '*.prx' | head -4
          echo "--- reference: samples/hello_world/Makefile"; cat "$TC/samples/hello_world/Makefile" || true

      - name: Check build environment
        run: make check OO_CXX=clang++-18 OO_LD=ld.lld-18

      - name: Build eboot.bin, param.sfo, PKG
        run: make OO_CXX=clang++-18 OO_LD=ld.lld-18 HENU_BUILD=${{ github.run_number }}

      # Separate, EXPERIMENTAL package: a PS4 home-screen theme. It must never
      # block the app PKG, hence continue-on-error. See docs/SYSTEM_THEME.md.
      - name: Build experimental PS4 system theme (separate PKG)
        continue-on-error: true
        run: |
          set -e
          git init -q /tmp/lop
          git -C /tmp/lop fetch -q --depth 1 https://github.com/OpenOrbis/LibOrbisPkg 92a4e7f8e5914cb06b52ba3ae6b0675da438a051
          git -C /tmp/lop checkout -q FETCH_HEAD
          python3 scripts/patch_liborbispkg_theme.py /tmp/lop
          dotnet build -c Release -o /tmp/pkgtool-theme /tmp/lop/PkgTool.Core/PkgTool.Core.csproj
          make -f Makefile.host CXX=g++ CXXFLAGS="-std=c++17 -O2 -Isrc -I." theme
          T="dotnet /tmp/pkgtool-theme/PkgTool.Core.dll"
          S=build/theme/sce_sys/param.sfo
          CID=IV0000-HENT00001_00-OSTLERTEKKERS000
          $T sfo_new $S
          $T sfo_setentry $S ATTRIBUTE   --type Integer --maxsize 4   --value 0
          $T sfo_setentry $S CATEGORY    --type Utf8    --maxsize 4   --value ac
          $T sfo_setentry $S CONTENT_ID  --type Utf8    --maxsize 48  --value $CID
          $T sfo_setentry $S CONTENT_VER --type Utf8    --maxsize 8   --value 01.00
          $T sfo_setentry $S FORMAT      --type Utf8    --maxsize 4   --value obs
          $T sfo_setentry $S IRO_TAG     --type Integer --maxsize 4   --value 2
          $T sfo_setentry $S PUBTOOLINFO --type Utf8    --maxsize 512 --value "c_date=$(date -u +%Y%m%d)"
          $T sfo_setentry $S TITLE       --type Utf8    --maxsize 128 --value "OSTLERTEKKERS HEN Theme"
          $T sfo_setentry $S TITLE_ID    --type Utf8    --maxsize 12  --value HENT00001
          $T sfo_setentry $S VERSION     --type Utf8    --maxsize 8   --value 01.00
          $T sfo_listentries $S
          (cd build/theme && $T pkg_build theme.gp4 "$GITHUB_WORKSPACE")
          ls -la "$CID.pkg"

      - name: Checksums
        run: |
          ls -la *.pkg eboot.bin
          sha256sum *.pkg eboot.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OSTLERTEKKERS_HEN-pkg
          path: |
            *.pkg
            SHA256SUMS.txt
            docs/INSTALLATION.md
            docs/SYSTEM_THEME.md

      - name: Publish as pre-release (download from the Releases page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" *.pkg SHA256SUMS.txt docs/INSTALLATION.md docs/SYSTEM_THEME.md \
            --target "${{ github.sha }}" --prerelease \
            --title "OSTLERTEKKERS HEN v0.6.1 – Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }} mit OpenOrbis v0.5.4. Installation: INSTALLATION.md (USB-Stick, exFAT, PKG ins Hauptverzeichnis, GoldHEN -> Debug Settings -> Package Installer) oder in der App: Update Center -> Online-Update."
